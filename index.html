ANGEL
<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Rendimiento diario neto</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #070b12;
      --panel: rgba(18, 24, 36, 0.92);
      --panel-border: rgba(255, 255, 255, 0.09);
      --field: #0c111b;
      --field-border: #283244;
      --text: #f5f7fb;
      --muted: #909bad;
      --accent: #7c9cff;
      --accent-soft: rgba(124, 156, 255, 0.15);
      --danger: #ff6b7a;
      --success: #40dfa2;
      --success-soft: rgba(64, 223, 162, 0.1);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-width: 320px;
      background: var(--bg);
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      overflow-x: hidden;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 0%, rgba(74, 102, 190, 0.18), transparent 34rem),
        radial-gradient(circle at 100% 100%, rgba(45, 199, 145, 0.08), transparent 30rem),
        var(--bg);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    main {
      display: grid;
      min-height: 100vh;
      min-height: 100svh;
      place-items: center;
      padding: 24px 16px;
    }

    .calculator {
      width: min(100%, 540px);
      padding: clamp(24px, 6vw, 40px);
      border: 1px solid var(--panel-border);
      border-radius: 28px;
      background: var(--panel);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.42);
      backdrop-filter: blur(20px);
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--accent);
      font-size: 0.75rem;
      font-weight: 750;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 420px;
      margin: 0;
      font-size: clamp(1.75rem, 7vw, 2.55rem);
      line-height: 1.08;
      letter-spacing: -0.04em;
    }

    .intro {
      margin: 12px 0 30px;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.55;
    }

    form {
      display: grid;
      gap: 20px;
    }

    .field {
      display: grid;
      gap: 9px;
    }

    label {
      color: #c4cbd7;
      font-size: 0.88rem;
      font-weight: 650;
    }

    .input-shell {
      position: relative;
      display: flex;
      align-items: center;
      min-width: 0;
      border: 1px solid var(--field-border);
      border-radius: 16px;
      background: var(--field);
      transition:
        border-color 160ms ease,
        box-shadow 160ms ease,
        background-color 160ms ease;
    }

    .input-shell:focus-within {
      border-color: var(--accent);
      background: #0f1521;
      box-shadow: 0 0 0 4px var(--accent-soft);
    }

    .affix {
      flex: 0 0 auto;
      color: #8f9aae;
      font-size: 1.1rem;
      font-weight: 700;
      pointer-events: none;
      user-select: none;
    }

    .prefix {
      padding-left: 18px;
    }

    .suffix {
      padding-right: 18px;
    }

    input {
      width: 100%;
      min-width: 0;
      height: 58px;
      padding: 0 16px;
      border: 0;
      outline: 0;
      color: var(--text);
      background: transparent;
      font: inherit;
      font-size: 1.08rem;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
      appearance: textfield;
    }

    input::placeholder {
      color: #566174;
      opacity: 1;
      transition: color 100ms ease;
    }

    input:focus::placeholder {
      color: transparent;
    }

    input::-webkit-inner-spin-button,
    input::-webkit-outer-spin-button {
      margin: 0;
      appearance: none;
    }

    .results {
      display: grid;
      gap: 4px;
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid var(--panel-border);
    }

    .result {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 15px 12px;
      border-radius: 14px;
    }

    .result-label {
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.3;
    }

    output {
      flex: 0 0 auto;
      color: #e7ebf2;
      font-size: 1.08rem;
      font-weight: 750;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
    }

    .tax output {
      color: var(--danger);
    }

    .net {
      margin-top: 8px;
      padding: 18px 16px;
      border: 1px solid rgba(64, 223, 162, 0.2);
      background: var(--success-soft);
    }

    .net .result-label {
      color: #b9d8cc;
      font-weight: 650;
    }

    .net output {
      color: var(--success);
      font-size: clamp(1.35rem, 5vw, 1.65rem);
    }

    @media (min-width: 620px) {
      main {
        padding: 40px 24px;
      }

      .rates {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <main>
    <section class="calculator" aria-labelledby="page-title">
      <header>
        <p class="eyebrow">Estimador de inversión</p>
        <h1 id="page-title">Rendimiento diario neto</h1>
        <p class="intro">
          Calcula la ganancia diaria estimada de tu inversión después de la retención de ISR.
        </p>
      </header>

      <form aria-label="Datos de inversión" autocomplete="off">
        <div class="field">
          <label for="capital">Capital</label>

          <div class="input-shell">
            <span class="affix prefix" aria-hidden="true">$</span>
            <input
              id="capital"
              name="capital"
              type="number"
              inputmode="decimal"
              min="0"
              step="any"
              placeholder="0.0"
              aria-describedby="capital-help"
            >
          </div>

          <span id="capital-help" hidden>
            Monto de la inversión en pesos mexicanos.
          </span>
        </div>

        <div class="rates">
          <div class="field">
            <label for="annual-rate">Tasa de Rendimiento Anual</label>

            <div class="input-shell">
              <input
                id="annual-rate"
                name="annual-rate"
                type="number"
                inputmode="decimal"
                min="0"
                step="any"
                value="15"
              >
              <span class="affix suffix" aria-hidden="true">%</span>
            </div>
          </div>

          <div class="field">
            <label for="isr-rate">Tasa ISR Anual</label>

            <div class="input-shell">
              <input
                id="isr-rate"
                name="isr-rate"
                type="number"
                inputmode="decimal"
                min="0"
                step="any"
                value="0.90"
              >
              <span class="affix suffix" aria-hidden="true">%</span>
            </div>
          </div>
        </div>
      </form>

      <section
        class="results"
        aria-label="Resultados diarios"
        aria-live="polite"
        aria-atomic="true"
      >
        <div class="result">
          <span class="result-label">Ganancia Bruta Diaria</span>
          <output id="gross-result" for="capital annual-rate">$0.00</output>
        </div>

        <div class="result tax">
          <span class="result-label">Retención de ISR Diaria</span>
          <output id="tax-result" for="capital isr-rate">$0.00</output>
        </div>

        <div class="result net">
          <span class="result-label">Ganancia Neta Diaria</span>
          <output id="net-result" for="capital annual-rate isr-rate">$0.00</output>
        </div>
      </section>
    </section>
  </main>

  <script>
    (() => {
      "use strict";

      const capitalInput = document.getElementById("capital");
      const annualRateInput = document.getElementById("annual-rate");
      const isrRateInput = document.getElementById("isr-rate");

      const grossResult = document.getElementById("gross-result");
      const taxResult = document.getElementById("tax-result");
      const netResult = document.getElementById("net-result");

      const currencyFormatter = new Intl.NumberFormat("es-MX", {
        style: "currency",
        currency: "MXN",
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });

      const toNonNegativeNumber = (value) => {
        const number = Number.parseFloat(value);
        return Number.isFinite(number) && number >= 0 ? number : 0;
      };

      const formatCurrency = (value) => {
        return currencyFormatter.format(Number.isFinite(value) ? value : 0);
      };

      const updateResults = () => {
        const capital = toNonNegativeNumber(capitalInput.value);
        const annualRate = toNonNegativeNumber(annualRateInput.value);
        const isrRate = toNonNegativeNumber(isrRateInput.value);

        const grossDailyProfit = (capital * (annualRate / 100)) / 360;
        const dailyIsrWithholding = (capital * (isrRate / 100)) / 365;
        const netDailyProfit = grossDailyProfit - dailyIsrWithholding;

        grossResult.value = formatCurrency(grossDailyProfit);
        taxResult.value = formatCurrency(dailyIsrWithholding);
        netResult.value = formatCurrency(netDailyProfit);
      };

      [capitalInput, annualRateInput, isrRateInput].forEach((input) => {
        input.addEventListener("input", updateResults);
      });

      updateResults();
    })();
  </script>
</body>
</html>
